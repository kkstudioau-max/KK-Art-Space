<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Remnant, an original mixed-media artwork by KK Art Space.">
  <title>Remnant | KK Art Space</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f8f7f4;
      --ink: #252522;
      --muted: #6d6b65;
      --line: #dedcd5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }

    header, main, footer {
      width: min(1100px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 24px 0;
      border-bottom: 1px solid var(--line);
    }

    a { color: inherit; }

    .brand {
      font-weight: 700;
      letter-spacing: .04em;
      text-decoration: none;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }

    nav a { color: var(--muted); text-decoration: none; }

    .back-link {
      display: inline-block;
      margin: 30px 0 18px;
      color: var(--muted);
    }

    h1, h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2.4rem, 6vw, 4rem);
      line-height: 1.1;
    }

    .details { color: var(--muted); }

    .main-image {
      display: block;
      width: 100%;
      max-height: 75vh;
      margin: 28px 0;
      object-fit: contain;
      background: #eeece6;
    }

    .description {
      max-width: 760px;
      margin: 32px 0 48px;
    }

    .description p { color: var(--muted); }

    .additional-images {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin: 24px 0 64px;
    }

    .additional-images img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      background: #eeece6;
    }

    footer {
      padding: 20px 0 28px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .85rem;
    }
