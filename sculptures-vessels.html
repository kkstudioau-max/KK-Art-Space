<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="KK Art Space - original mixed-media artworks exploring texture, fragility, resilience and the quieter layers of human experience.">
  <title>KK Art Space | Original Mixed-Media Art</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f8f7f4;
      --ink: #252522;
      --muted: #6d6b65;
      --line: #dedcd5;
      --accent: #716d61;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }

    a { color: inherit; }

    header, main, footer {
      width: min(1100px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 0;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: .04em;
      text-decoration: none;
    }

    nav a {
      margin-left: 24px;
      color: var(--muted);
      font-size: .92rem;
      text-decoration: none;
    }

    nav a:hover, .contact-link:hover { color: var(--ink); }

    .intro {
      max-width: 700px;
      padding: 76px 0 64px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0 16px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.7rem, 7vw, 5rem);
      font-weight: 400;
      letter-spacing: -.045em;
      line-height: 1.05;
    }

    .intro p {
      max-width: 560px;
      color: var(--muted);
      font-size: 1.08rem;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 22px;
    }

    h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.8rem;
      font-weight: 400;
    }

    .section-heading p {
      color: var(--muted);
      font-size: .9rem;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
      padding-bottom: 76px;
    }

    .artwork-placeholder {
      display: grid;
      min-height: 300px;
      place-items: center;
      padding: 24px;
      border: 1px dashed #c9c6bc;
      background: #eeece6;
      color: var(--muted);
      text-align: center;
    }

    .artwork-placeholder span {
      max-width: 190px;
      font-size: .9rem;
    }

    .artwork h3 {
      margin: 12px 0 2px;
      font-size: 1rem;
      font-weight: 600;
    }

    .artwork p {
      margin: 0;
      color: var(--muted);
      font-size: .9rem;
    }

    .about {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 40px;
      padding: 40px 0 72px;
      border-top: 1px solid var(--line);
    }

    .about p {
      max-width: 600px;
      margin-top: 0;
      color: var(--muted);
    }

    .contact-link {
      display: inline-block;
      margin-top: 8px;
      font-weight: 600;
      text-underline-offset: 4px;
    }

    footer {
      padding: 20px 0 28px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .85rem;
    }

    @media (max-width: 700px) {
      header { align-items: flex-start; }
      nav a { margin-left: 14px; }
      .intro { padding: 58px 0 48px; }
      .gallery { grid-template-columns: 1fr; gap: 28px; }
      .artwork-placeholder { min-height: 340px; }
      .about { grid-template-columns: 1fr; gap: 12px; }
      .section-heading { display: block; }
      .section-heading p { margin-bottom: 0; }
    }
    .artwork-image {
  display: block;
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: contain;
  background: #eeece6;
}
    .featured-carousel {
  margin: 0 0 76px;
}

.featured-slide {
  display: none;
  margin: 0;
}

.featured-slide.is-active {
  display: block;
}

.featured-slide img {
  display: block;
  width: 100%;
  height: clamp(300px, 68vh, 700px);
  object-fit: contain;
  background: #eeece6;
}

.featured-slide figcaption {
  padding: 10px 0;
  text-align: center;
}

.carousel-controls {
  display: flex;
  justify-content: center;
  gap: 12px;
}

.carousel-controls button {
  padding: 8px 14px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink);
  cursor: pointer;
  font: inherit;
}

.category-section {
  padding: 40px 0 72px;
  border-top: 1px solid var(--line);
}
  </style>
</head>
<body>
  <header>
    <a class="brand" href="index.html#home">KK Art Space</a>
    <nav aria-label="Main navigation">
  <a href="wall-floor-art.html">Wall Art</a>
  <a href="sculptures-vessels.html">Sculptures & Vessels</a>
  <a href="index.html#contact">Contact</a>
</nav>
  </header>
  
    <main>
  <section class="category-section" id="sculptures-vessels">
    <div class="eyebrow">Three-dimensional works</div>
    <h1>Sculptures and Vessels</h1>
    <div class="gallery">
  <article class="artwork">
    <a class="artwork-link" href="caldera-relic.html">
      <img class="artwork-image" src="Caldera-relic-1.jpeg" alt="Caldera Relic, sculptural vessel">
      <h3>Caldera Relic</h3>
    </a>
    <p>300 × 230 mm | Mixed media sculptural vessel | Original 1/1</p>
  </article>
      <article class="artwork">
  <a class="artwork-link" href="jasper-hollow.html">
    <img class="artwork-image" src="Jasper-1.jpeg" alt="Jasper Hollow, mixed-media sculpture">
    <h3>Jasper Hollow</h3>
  </a>
  <p>390 × 240 × 190 mm | Mixed media sculpture | Original 1/1</p>
</article>
</div>
  </section>

  </main>

  <footer>© 2026 KK Art Space · Australia</footer>
</body>
</html>
