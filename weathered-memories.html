<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Weathered Memories, an original artwork by KK Art Space.">
  <title>Weathered Memories | KK Art Space</title>
  <link rel="stylesheet" href="image-viewer.css">
  <style>
    :root {
      color-scheme: light;
      --paper: #f8f7f4;
      --ink: #252522;
      --muted: #6d6b65;
      --line: #dedcd5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }

    header, main, footer {
      width: min(1100px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 24px 0;
      border-bottom: 1px solid var(--line);
    }

    a { color: inherit; }

    .brand {
      font-weight: 700;
      letter-spacing: .04em;
      text-decoration: none;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }

    nav a { color: var(--muted); text-decoration: none; }

    .back-link {
      display: inline-block;
      margin: 30px 0 18px;
      color: var(--muted);
    }

    h1, h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2.4rem, 6vw, 4rem);
      line-height: 1.1;
    }

    .main-image {
      display: block;
      width: 100%;
      max-height: 75vh;
      margin: 28px 0;
      object-fit: contain;
      background: #eeece6;
    }

    .additional-images {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin: 24px 0 64px;
    }

    .additional-images img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      background: #eeece6;
      cursor: zoom-in;
    }

    footer {
      padding: 20px 0 28px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .85rem;
    }

    @media (max-width: 650px) {
      header { align-items: flex-start; flex-direction: column; }
      .additional-images { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="index.html#home">KK Art Space</a>
    <nav aria-label="Main navigation">
      <a href="wall-floor-art.html">Wall Art</a>
      <a href="sculptures-vessels.html">Sculptures &amp; Vessels</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <main>
    <a class="back-link" href="wall-floor-art.html">← Back to Wall Art</a>
    <h1>Weathered Memories</h1>

    <img class="main-image image-viewer-trigger"
         src="Weathered%20Memories/Weathered-Memories-1.jpg"
         alt="Weathered Memories, full view">

    <h2>Additional views</h2>
    <div class="additional-images" aria-label="Additional views of Weathered Memories">
      <img class="image-viewer-trigger"
           src="Weathered%20Memories/Weathered-Memories-2.jpg"
           alt="Additional view of Weathered Memories">
      <img class="image-viewer-trigger"
           src="Weathered%20Memories/Weathered-Memories-3.jpg"
           alt="Additional view of Weathered Memories">
      <img class="image-viewer-trigger"
           src="Weathered%20Memories/Weathered-Memories-4.jpg"
           alt="Additional view of Weathered Memories">
    </div>
  </main>

  <footer>© 2026 KK Art Space · Australia</footer>
  <script src="image-viewer.js"></script>
</body>
</html>
